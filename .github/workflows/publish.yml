name: Publish Packages

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release (even if not triggered by a tag)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  check-version:
    name: Check Version & Release Eligibility
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine if this commit is a release
        id: check
        run: |
          VERSION=$(sed -n 's/.*project(tpm-pin VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ -z "$VERSION" ]; then VERSION="1.0.4"; fi
          TAG="v${VERSION}"
          echo "Current project version: ${VERSION}"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "Direct tag push detected: ${GITHUB_REF_NAME}"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_release }}" == "true" ]]; then
            echo "Manual workflow dispatch release triggered for: ${TAG}"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            git fetch --tags origin || true
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1 || [ -n "$(git tag -l "${TAG}")" ]; then
              echo "Tag ${TAG} already exists on remote. Normal commit on main — skipping release."
              echo "should_release=false" >> $GITHUB_OUTPUT
            else
              echo "Version bump detected (${TAG}) without an existing release tag! Publishing release."
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
              echo "version=${VERSION}" >> $GITHUB_OUTPUT
            fi
          else
            echo "Not on main or release tag — skipping release."
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  test:
    name: Run Automated Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gcc \
            pkg-config \
            libssl-dev \
            libpam0g-dev \
            libtss2-dev \
            swtpm \
            swtpm-tools \
            python3 \
            python3-gi \
            gir1.2-adw-1

      - name: Run Test Suite with swtpm
        run: ./tests/run_tests.sh

  build-linux-packages:
    name: Build Linux Packages (DEB, RPM, TGZ)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build & packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gcc \
            pkg-config \
            libssl-dev \
            libpam0g-dev \
            libtss2-dev \
            rpm \
            python3

      - name: Configure CMake (Release)
        run: |
          cmake -B build-release -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Compile project
        run: |
          cmake --build build-release -j$(nproc)

      - name: Generate Packages (DEB, RPM, TGZ)
        run: |
          cd build-release
          cpack -G DEB
          cpack -G RPM
          cpack -G TGZ

      - name: Prepare Artifacts Directory
        run: |
          mkdir -p dist
          shopt -s nullglob
          FILES=(build-release/*.deb build-release/*.rpm build-release/*.tar.gz)
          if [ ${#FILES[@]} -gt 0 ]; then
            cp "${FILES[@]}" dist/
          fi
          echo "Generated packages:"
          ls -lh dist/

      - name: Upload Linux Packages Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error

  build-arch-package:
    name: Build Arch Linux Package (pkg.tar.zst)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build Arch Package in Docker
        run: |
          mkdir -p dist
          # Determine version: prioritize tag, then CMakeLists.txt version
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's/.*project(tpm-pin VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
            if [ -z "$VERSION" ]; then VERSION="1.0.4"; fi
          fi

          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ github.workspace }}/dist:/out" \
            archlinux:latest bash -c "
              pacman -Sy --noconfirm base-devel cmake git openssl pam tpm2-tss python python-gobject libadwaita >/dev/null
              useradd -m builder
              echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
              git config --global --add safe.directory '*'
              mkdir -p /home/builder/pkg
              git clone /src /home/builder/repo
              cd /home/builder/repo
              git archive --format=tar.gz --prefix=tpm-pin-${VERSION}/ HEAD > /home/builder/pkg/tpm-pin-${VERSION}.tar.gz
              cp packaging/arch/PKGBUILD packaging/arch/tpm-pin.install /home/builder/pkg/
              sed -i \"s/^pkgver=.*/pkgver=${VERSION}/\" /home/builder/pkg/PKGBUILD
              chown -R builder:builder /home/builder
              su builder -c 'cd /home/builder/pkg && makepkg -f --noconfirm'
              cp /home/builder/pkg/*.pkg.tar.zst /out/
            "
          echo "Generated Arch packages:"
          ls -lh dist/

      - name: Upload Arch Package Artifact
        uses: actions/upload-artifact@v7
        with:
          name: arch-packages
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  build-flatpak-package:
    name: Build Flatpak Package (.flatpak)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Flatpak & flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Build Flatpak Bundle
        run: |
          mkdir -p dist build-flatpak repo
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's/.*project(tpm-pin VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
            if [ -z "$VERSION" ]; then VERSION="1.0.4"; fi
          fi

          flatpak-builder --user --force-clean --repo=repo build-flatpak packaging/flatpak/io.github.securepin.Settings.yml
          flatpak build-bundle repo dist/io.github.securepin.Settings-${VERSION}.flatpak io.github.securepin.Settings
          echo "Generated Flatpak bundle:"
          ls -lh dist/

      - name: Upload Flatpak Package Artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-package
          path: dist/*.flatpak
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [check-version, build-linux-packages, build-arch-package, build-flatpak-package]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all package artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          echo "=== Computed SHA-256 Checksums ==="
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: release_info
        run: |
          TAG_NAME="${{ needs.check-version.outputs.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG_NAME="${{ github.ref_name }}"
            else
              VERSION=$(sed -n 's/.*project(tpm-pin VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
              if [ -z "$VERSION" ]; then VERSION="1.0.4"; fi
              TAG_NAME="v${VERSION}"
            fi
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.release_info.outputs.tag_name }}
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
