name: Publish Packages

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release (even if not triggered by a tag)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gcc \
            pkg-config \
            libssl-dev \
            libpam0g-dev \
            libtss2-dev \
            swtpm \
            swtpm-tools \
            python3 \
            python3-gi \
            gir1.2-adw-1

      - name: Run Test Suite with swtpm
        run: ./tests/run_tests.sh

  build-linux-packages:
    name: Build Linux Packages (DEB, RPM, TGZ)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build & packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gcc \
            pkg-config \
            libssl-dev \
            libpam0g-dev \
            libtss2-dev \
            rpm \
            python3

      - name: Configure CMake (Release)
        run: |
          cmake -B build-release -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Compile project
        run: |
          cmake --build build-release -j$(nproc)

      - name: Generate Packages (DEB, RPM, TGZ)
        run: |
          cd build-release
          cpack -G DEB
          cpack -G RPM
          cpack -G TGZ

      - name: Prepare Artifacts Directory
        run: |
          mkdir -p dist
          shopt -s nullglob
          FILES=(build-release/*.deb build-release/*.rpm build-release/*.tar.gz)
          if [ ${#FILES[@]} -gt 0 ]; then
            cp "${FILES[@]}" dist/
          fi
          echo "Generated packages:"
          ls -lh dist/

      - name: Upload Linux Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error

  build-arch-package:
    name: Build Arch Linux Package (pkg.tar.zst)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Arch Package in Docker
        run: |
          mkdir -p dist
          # Determine version: prioritize tag, then CMakeLists.txt version
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's/.*project(tpm-pin VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
            if [ -z "$VERSION" ]; then VERSION="1.0.1"; fi
          fi

          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ github.workspace }}/dist:/out" \
            archlinux:latest bash -c "
              pacman -Sy --noconfirm base-devel cmake git openssl pam tpm2-tss python python-gobject libadwaita >/dev/null
              useradd -m builder
              echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
              git config --global --add safe.directory '*'
              mkdir -p /home/builder/pkg
              git clone /src /home/builder/repo
              cd /home/builder/repo
              git archive --format=tar.gz --prefix=tpm-pin-${VERSION}/ HEAD > /home/builder/pkg/tpm-pin-${VERSION}.tar.gz
              cp packaging/arch/PKGBUILD /home/builder/pkg/
              sed -i \"s/^pkgver=.*/pkgver=${VERSION}/\" /home/builder/pkg/PKGBUILD
              chown -R builder:builder /home/builder
              su builder -c 'cd /home/builder/pkg && makepkg -f --noconfirm'
              cp /home/builder/pkg/*.pkg.tar.zst /out/
            "
          echo "Generated Arch packages:"
          ls -lh dist/

      - name: Upload Arch Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [build-linux-packages, build-arch-package]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          echo "=== Computed SHA-256 Checksums ==="
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            VERSION=$(sed -n 's/.*project(tpm-pin VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
            if [ -z "$VERSION" ]; then VERSION="1.0.1"; fi
            TAG_NAME="v${VERSION}-$(date +'%Y%m%d%H%M%S')"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: Release ${{ steps.release_info.outputs.tag_name }}
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
