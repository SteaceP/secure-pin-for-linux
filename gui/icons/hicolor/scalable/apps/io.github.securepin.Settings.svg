<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#3584e4" flood-opacity="0.6"/>
    </filter>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>

    <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242c38"/>
      <stop offset="100%" stop-color="#141a24"/>
    </linearGradient>

    <linearGradient id="shackleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#9aa2ab"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5c211"/>
      <stop offset="100%" stop-color="#e5a50a"/>
    </linearGradient>
  </defs>

  <!-- Outer Squircle with Shadow -->
  <rect x="12" y="12" width="104" height="104" rx="26" ry="26" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Inner Bevel Highlight -->
  <rect x="13" y="13" width="102" height="102" rx="25" ry="25" fill="none" stroke="#78aeed" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Hardware TPM Chip Substrate -->
  <rect x="26" y="26" width="76" height="76" rx="14" ry="14" fill="url(#plateGrad)" stroke="#384454" stroke-width="1.5"/>

  <!-- Gold Chip Contact Pins -->
  <g fill="url(#goldGrad)">
    <rect x="44" y="23" width="6" height="5" rx="1"/>
    <rect x="54" y="23" width="6" height="5" rx="1"/>
    <rect x="68" y="23" width="6" height="5" rx="1"/>
    <rect x="78" y="23" width="6" height="5" rx="1"/>
    <rect x="44" y="100" width="6" height="5" rx="1"/>
    <rect x="54" y="100" width="6" height="5" rx="1"/>
    <rect x="68" y="100" width="6" height="5" rx="1"/>
    <rect x="78" y="100" width="6" height="5" rx="1"/>
    <rect x="23" y="44" width="5" height="6" rx="1"/>
    <rect x="23" y="54" width="5" height="6" rx="1"/>
    <rect x="23" y="68" width="5" height="6" rx="1"/>
    <rect x="23" y="78" width="5" height="6" rx="1"/>
    <rect x="100" y="44" width="5" height="6" rx="1"/>
    <rect x="100" y="54" width="5" height="6" rx="1"/>
    <rect x="100" y="68" width="5" height="6" rx="1"/>
    <rect x="100" y="78" width="5" height="6" rx="1"/>
  </g>

  <!-- Lock Shackle -->
  <path d="M 51 52 V 43 A 13 13 0 0 1 77 43 V 52" fill="none" stroke="url(#shackleGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Lock Body -->
  <rect x="44" y="51" width="40" height="30" rx="6" ry="6" fill="#1c71d8" stroke="#62a0ea" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Keyhole -->
  <circle cx="64" cy="63" r="3.5" fill="#ffffff"/>
  <path d="M 62.5 63 L 61 72 H 67 L 65.5 63 Z" fill="#ffffff"/>

  <!-- PIN Entry Code Indicators -->
  <g>
    <circle cx="46" cy="90" r="3.5" fill="#57e389"/>
    <circle cx="58" cy="90" r="3.5" fill="#57e389"/>
    <circle cx="70" cy="90" r="3.5" fill="#57e389"/>
    <circle cx="82" cy="90" r="3.5" fill="#62a0ea"/>
  </g>
</svg>
